<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ori</title>
<style>
  :root[data-theme="light"] {
    --bg: #f2f2f5;
    --panel: rgba(255,255,255,0.55);
    --panel-border: rgba(0,0,0,0.08);
    --text: #16161a;
    --text-dim: #6b6b73;
    --bubble-user: rgba(20,20,22,0.92);
    --bubble-user-text: #fff;
    --bubble-assistant: rgba(255,255,255,0.78);
    --accent: #16161a;
    --input-bg: rgba(255,255,255,0.65);
    --shadow: 0 8px 24px rgba(0,0,0,0.06);
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0c;
    --panel: rgba(255,255,255,0.055);
    --panel-border: rgba(255,255,255,0.09);
    --text: #f2f2f5;
    --text-dim: #8f8f98;
    --bubble-user: rgba(255,255,255,0.95);
    --bubble-user-text: #0a0a0c;
    --bubble-assistant: rgba(255,255,255,0.065);
    --accent: #f2f2f5;
    --input-bg: rgba(255,255,255,0.045);
    --shadow: 0 8px 28px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    transition: background 0.2s ease, color 0.2s ease;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 640px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: var(--panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;
    z-index: 5;
  }
  header .logo {
    font-weight: 800; font-size: 20px; letter-spacing: 0.3px;
    display: flex; align-items: center; gap: 8px;
  }
  header .logo .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, #7dd3fc, #a78bfa);
    box-shadow: 0 0 8px rgba(167,139,250,0.6);
  }
  header button {
    background: none; border: none; color: var(--text); font-size: 19px;
    cursor: pointer; padding: 8px; border-radius: 10px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  header button:active { transform: scale(0.9); background: var(--panel-border); }

  #messages {
    flex: 1; overflow-y: auto; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .bubble {
    max-width: 82%; padding: 11px 15px; border-radius: 18px; font-size: 15px; line-height: 1.45;
    white-space: pre-wrap; word-wrap: break-word;
    animation: riseIn 0.22s ease both;
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .bubble.user {
    align-self: flex-end; background: var(--bubble-user); color: var(--bubble-user-text);
    border-bottom-right-radius: 5px; box-shadow: var(--shadow);
  }
  .bubble.assistant {
    align-self: flex-start; background: var(--bubble-assistant); border: 1px solid var(--panel-border);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom-left-radius: 5px;
    max-width: 90%;
  }
  .bubble img.thumb { max-width: 100%; border-radius: 12px; margin-top: 8px; display: block; }
  .bubble iframe { display: block; }
  .bubble .ytFallback {
    display: block; font-size: 12px; color: var(--text-dim); margin-top: 6px; text-decoration: none;
  }

  .statusRow {
    align-self: flex-start; display: flex; align-items: center; gap: 8px;
    color: var(--text-dim); font-size: 13px; padding: 2px 4px 4px;
  }
  .dots { display: flex; gap: 3px; }
  .dots span {
    width: 5px; height: 5px; border-radius: 50%; background: var(--text-dim);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  #inputBar {
    display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--panel-border); flex-shrink: 0;
  }
  #imgPreviewWrap { padding: 8px 14px 0; display: none; align-items: center; }
  #imgPreview { max-height: 56px; border-radius: 10px; display: block; box-shadow: var(--shadow); }
  #removeImg {
    background: rgba(0,0,0,0.65); color: #fff; border: none; border-radius: 50%;
    width: 20px; height: 20px; font-size: 11px; cursor: pointer; margin-left: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  #attachBtn, #sendBtn {
    border: none; border-radius: 50%;
    width: 42px; height: 42px; flex-shrink: 0; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  #attachBtn:active, #sendBtn:active { transform: scale(0.9); }
  #sendBtn { background: var(--accent); color: var(--bg); }
  #attachBtn { background: transparent; color: var(--text); border: 1px solid var(--panel-border); }
  #textInput {
    flex: 1; resize: none; border: none; outline: none; background: var(--input-bg);
    color: var(--text); border-radius: 22px; padding: 11px 16px; font-size: 15px;
    max-height: 100px; font-family: inherit; transition: background 0.2s ease;
  }
  #textInput::placeholder { color: var(--text-dim); }

  #settingsPanel {
    position: fixed; top: 0; right: 0; height: 100%; width: 82%; max-width: 320px;
    background: var(--panel); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-left: 1px solid var(--panel-border);
    transform: translateX(100%); transition: transform 0.28s cubic-bezier(.4,0,.2,1);
    z-index: 20; padding: 24px 20px; display: flex; flex-direction: column; gap: 22px;
  }
  #settingsPanel.open { transform: translateX(0); }
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity 0.28s ease;
  }
  #overlay.open { opacity: 1; pointer-events: auto; }
  .settingRow { display: flex; align-items: center; justify-content: space-between; }
  .settingRow span { font-size: 15px; }
  .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: rgba(120,120,120,0.35); border-radius: 26px;
    cursor: pointer; transition: 0.2s;
  }
  .slider::before {
    content: ""; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px;
    background: #fff; border-radius: 50%; transition: 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(20px); }
  #settingsPanel h3 { margin: 0; font-size: 19px; font-weight: 800; }
  #settingsPanel .hint { font-size: 12px; color: var(--text-dim); margin-top: -14px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="dot"></span>Ori</div>
    <button id="settingsBtn">⚙</button>
  </header>

  <div id="messages"></div>

  <div id="imgPreviewWrap">
    <img id="imgPreview" />
    <button id="removeImg">✕</button>
  </div>

  <div id="inputBar">
    <button id="attachBtn">📎</button>
    <textarea id="textInput" rows="1" placeholder="Message Ori..."></textarea>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <button id="sendBtn">➤</button>
  </div>
</div>

<div id="overlay"></div>
<div id="settingsPanel">
  <h3>Settings</h3>
  <div class="settingRow">
    <span>Dark mode</span>
    <label class="switch">
      <input type="checkbox" id="themeToggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="settingRow">
    <span>Speak replies</span>
    <label class="switch">
      <input type="checkbox" id="ttsToggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="settingRow">
    <span>Speak confirmations too</span>
    <label class="switch">
      <input type="checkbox" id="ttsConfirmToggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="hint">If off, Ori stays quiet for "should I send this?" prompts and only speaks final results.</div>
</div>

<script>
const API_BASE = "https://personal-assistant.hn3156259.workers.dev";

let ORI_AUTH_KEY = "";
while (!ORI_AUTH_KEY) {
  const entered = prompt("Ori password:");
  if (entered) {
    ORI_AUTH_KEY = entered;
  }
}

function authHeaders(extra) {
  return Object.assign({ "X-Ori-Auth": ORI_AUTH_KEY }, extra || {});
}

const messagesEl = document.getElementById("messages");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");
const attachBtn = document.getElementById("attachBtn");
const fileInput = document.getElementById("fileInput");
const imgPreviewWrap = document.getElementById("imgPreviewWrap");
const imgPreview = document.getElementById("imgPreview");
const removeImg = document.getElementById("removeImg");
const settingsBtn = document.getElementById("settingsBtn");
const settingsPanel = document.getElementById("settingsPanel");
const overlay = document.getElementById("overlay");
const themeToggle = document.getElementById("themeToggle");
const ttsToggle = document.getElementById("ttsToggle");
const ttsConfirmToggle = document.getElementById("ttsConfirmToggle");

let pendingImage = null;

// ---- theme & settings (dark is default) ----
const savedTheme = localStorage.getItem("ori_theme") || "dark";
document.documentElement.setAttribute("data-theme", savedTheme);
themeToggle.checked = savedTheme === "dark";

const savedTts = localStorage.getItem("ori_tts") === "true";
ttsToggle.checked = savedTts;

const savedTtsConfirm = localStorage.getItem("ori_tts_confirm") !== "false";
ttsConfirmToggle.checked = savedTtsConfirm;

themeToggle.addEventListener("change", () => {
  const t = themeToggle.checked ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("ori_theme", t);
});
ttsToggle.addEventListener("change", () => localStorage.setItem("ori_tts", ttsToggle.checked));
ttsConfirmToggle.addEventListener("change", () => localStorage.setItem("ori_tts_confirm", ttsConfirmToggle.checked));

settingsBtn.addEventListener("click", () => {
  settingsPanel.classList.add("open");
  overlay.classList.add("open");
});
overlay.addEventListener("click", () => {
  settingsPanel.classList.remove("open");
  overlay.classList.remove("open");
});

// ---- rendering (with YouTube auto-embed + fallback link) ----
function typeText(el, text, speed) {
  speed = speed || 12;
  let i = 0;
  return new Promise((resolve) => {
    function step() {
      el.textContent = text.slice(0, i);
      i++;
      if (i <= text.length) {
        requestAnimationFrame(() => setTimeout(step, speed));
      } else {
        resolve();
      }
    }
    step();
  });
}

function addBubble(role, text, imageDataUrl, animate) {
  const div = document.createElement("div");
  div.className = "bubble " + (role === "user" ? "user" : "assistant");

  const ytMatch = text && text.match(/youtube\.com\/watch\?v=([a-zA-Z0-9_-]{6,})/);
  const displayText = ytMatch ? text.replace(ytMatch[0], "").trim() : text;
  const finalText = displayText || (ytMatch ? "🎵 Now playing:" : "");

  if (role === "assistant" && animate) {
    div.textContent = "";
    messagesEl.appendChild(div);
    typeText(div, finalText, 10).then(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  } else {
    div.textContent = finalText;
  }

  if (imageDataUrl) {
    const img = document.createElement("img");
    img.src = imageDataUrl;
    img.className = "thumb";
    div.appendChild(img);
  }

  if (ytMatch) {
    const iframe = document.createElement("iframe");
    iframe.width = "100%";
    iframe.height = "70";
    iframe.style.borderRadius = "10px";
    iframe.style.marginTop = "8px";
    iframe.style.border = "none";
    iframe.allow = "autoplay; encrypted-media";
    iframe.src = "https://www.youtube.com/embed/" + ytMatch[1] + "?autoplay=1";
    div.appendChild(iframe);

    const fallbackLink = document.createElement("a");
    fallbackLink.href = "https://youtube.com/watch?v=" + ytMatch[1];
    fallbackLink.target = "_blank";
    fallbackLink.rel = "noopener";
    fallbackLink.className = "ytFallback";
    fallbackLink.textContent = "▶ If it doesn't play above, open in YouTube";
    div.appendChild(fallbackLink);
  }

  if (!(role === "assistant" && animate)) {
    messagesEl.appendChild(div);
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addStatus(label) {
  const div = document.createElement("div");
  div.className = "statusRow";
  div.id = "statusIndicator";
  div.innerHTML = `<span>${label}</span><span class="dots"><span></span><span></span><span></span></span>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function updateStatus(label) {
  const el = document.getElementById("statusIndicator");
  if (el) el.querySelector("span").textContent = label;
}
function removeStatus() {
  const el = document.getElementById("statusIndicator");
  if (el) el.remove();
}

// ---- history ----
async function loadHistory() {
  try {
    const res = await fetch(API_BASE + "/history", { headers: authHeaders() });
    const rows = await res.json();
    rows.forEach(r => addBubble(r.role, r.content));
  } catch (e) {
    console.log("Failed to load history", e);
  }
}
loadHistory();

// ---- image attach ----
attachBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
      const base64 = dataUrl.split(",")[1];
      pendingImage = { data: base64, mimeType: "image/jpeg", filename: file.name || "image.jpg" };
      imgPreview.src = dataUrl;
      imgPreviewWrap.style.display = "flex";
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  fileInput.value = "";
});

removeImg.addEventListener("click", () => {
  pendingImage = null;
  imgPreviewWrap.style.display = "none";
});

// ---- sending ----
textInput.addEventListener("input", () => {
  textInput.style.height = "auto";
  textInput.style.height = Math.min(textInput.scrollHeight, 100) + "px";
});
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener("click", sendMessage);

function isConfirmationPrompt(text) {
  return /\(yes\/no\)\s*$/i.test(text.trim());
}

async function sendMessage() {
  const text = textInput.value.trim();
  if (!text && !pendingImage) return;

  const imageForBubble = pendingImage ? "data:" + pendingImage.mimeType + ";base64," + pendingImage.data : null;
  addBubble("user", text, imageForBubble);

  const payload = { message: text || "Describe this image." };
  if (pendingImage) payload.image = pendingImage;

  textInput.value = "";
  textInput.style.height = "auto";
  pendingImage = null;
  imgPreviewWrap.style.display = "none";

  addStatus("Ori is thinking");

  try {
    const res = await fetch(API_BASE, {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    const reply = data.reply || "(no reply)";

    const shouldSpeak = ttsToggle.checked && (ttsConfirmToggle.checked || !isConfirmationPrompt(reply));

    removeStatus();
    addBubble("assistant", reply, null, true);

    if (shouldSpeak) {
      await playTts(reply);
    }
  } catch (err) {
    removeStatus();
    addBubble("assistant", "Something went wrong reaching Ori.");
  }
}

async function playTts(text) {
  try {
    const res = await fetch(API_BASE + "/tts", {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ text })
    });
    if (!res.ok) return;
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    await audio.play().catch(() => {});
  } catch (e) {
    console.log("TTS playback failed", e);
  }
}
</script>
</body>
</html>
